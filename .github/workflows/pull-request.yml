# Checks every pull request before it can reach the live site.
#
# This builds the way the deploy does, not the way `npm run build` does on a
# laptop. `actions/configure-pages` is what injects `output: export` and the
# basePath into the Next config, and some failures only appear under those:
# a route handler missing `export const dynamic = "force-static"` builds
# perfectly well locally and breaks the export. That is the whole reason this
# file exists, so do not simplify it to a plain `next build`.
#
# It does not deploy anything. Deploying stays in nextjs.yml, on pushes to main.
name: Pull request

on:
  pull_request:
    branches: ["main"]

# Read-only except for what configure-pages needs to look up the site's URL.
# Note: a pull request opened from a fork gets a read-only token whatever this
# says, so a fork's build may fail here. Everyone on the team pushes branches
# to this repository, so that does not come up in practice.
permissions:
  contents: read
  pages: write
  id-token: write

# A second push to the same pull request makes the first run pointless.
concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          static_site_generator: next

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Content validation runs inside the build: `assertContentValid()` is
      # called from app/layout.tsx, so a malformed content file fails here
      # rather than shipping.
      - name: Build
        run: npm run build
