# Base44 development environment for the Antares website.
#
# Next.js static site with no backend services and no external credentials, so
# a single app service runs the dev server straight from the cloned source.
# Edit anything under the repo root and the live-reload server picks it up.

services:
  web:
    image: node:22
    working_dir: /app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=development
      # Next.js gates dev assets/HMR by Origin; next.config.ts reads this to
      # allow the preview origin. Referenced by name, never hardcoded.
      - BASE44_PUBLIC_HOST_SUFFIX
    volumes:
      - .:/app
    command:
      - sh
      - -ec
      - |
        npm ci --no-audit --no-fund
        exec npm run dev -- --hostname 0.0.0.0 --port 3000
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 240s
    restart: on-failure
